<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="3D Cyber City Skyline - All Repositories &amp; Commits">
  <defs>
    <!-- Dark Cyber Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010409"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glassmorphic HUD Header Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Golden Shader Gradients (YOUR UNIQUE GOLD TOWER) -->
    <linearGradient id="goldFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="storyLedGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Cyan Shader Gradients (Community Buildings) -->
    <linearGradient id="cyanFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cyanSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#155e75"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="storyLedCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <!-- Purple Shader Gradients (Global Tallest Megatower) -->
    <linearGradient id="purpleFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="purpleSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="storyLedPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>

    <!-- Slate Shader Gradients (Small Repo Buildings) -->
    <linearGradient id="slateFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="slateSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Perspective Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>

    <!-- Compatibility Optimized Glow Filters -->
    <filter id="neonGlowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /* Note: Hover interactions removed for compatibility with image embedding */
      
      /* Explicit static roof colors for compatibility */
      .building-group.gold .tower-roof { fill: #facc15; }
      .building-group.cyan .tower-roof { fill: #0891b2; }
      .building-group.purple .tower-roof { fill: #c084fc; }
      .building-group.slate .tower-roof { fill: #475569; }

      /* Animated Floor Stories (Activity Lights) */
      .floor-story polygon {
        animation: storyPulse 3.5s ease-in-out infinite alternate;
      }
      @keyframes storyPulse {
        0% { opacity: 0.4; }
        50% { opacity: 0.95; }
        100% { opacity: 0.6; }
      }

      .hud-float { animation: float 6s ease-in-out infinite; }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .laser-beam {
        stroke-dasharray: 12 18;
        animation: laserMove 2s linear infinite;
      }
      @keyframes laserMove {
        to { stroke-dashoffset: -60; }
      }

      .scanline {
        animation: scan 8s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(0); opacity: 0; }
        20% { opacity: 0.25; }
        80% { opacity: 0.25; }
        100% { transform: translateY(550px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="620" fill="url(#skyGrad)"/>

  <!-- Stars / Digital Data Particles -->
  <g opacity="0.65">
    <circle cx="90" cy="70" r="1.5" fill="#facc15"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="100" r="2" fill="#38bdf8"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="60" r="1.5" fill="#c084fc"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="120" r="1.8" fill="#facc15"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Glassmorphic Header HUD Card -->
  <g class="hud-float">
    <rect x="60" y="20" width="1080" height="95" rx="16" fill="url(#glassGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" filter="url(#neonGlowCyan)"/>
    <rect x="60" y="20" width="1080" height="28" rx="16" fill="#38bdf8" fill-opacity="0.1"/>
    
    <text x="84" y="39" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, monospace" font-weight="700" font-size="12" letter-spacing="1.5">⚡ 3D DEVELOPER CITY · REPOSITORIES &amp; COMMIT STORIES METROPOLIS</text>
    <text x="84" y="68" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="600">Every building = A public repository | Building stories = Commit count | Golden Crown Tower = YOUR REPO</text>
    <text x="84" y="90" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">Hover tooltips disabled for image compatibility. See individual building labels below.</text>
  </g>

  <!-- City Ground Perspective Grid -->
  <g transform="translate(0, 440)">
    <rect x="-100" y="0" width="1400" height="180" fill="#030712"/>
    <rect x="-100" y="0" width="1400" height="180" fill="url(#grid)"/>
    
    <!-- Cyber Neon Highways & Streets -->
    <path class="laser-beam" d="M -50 40 L 1250 40" stroke="#facc15" stroke-width="3" filter="url(#neonGlowGold)"/>
    <path class="laser-beam" d="M -50 85 L 1250 85" stroke="#22d3ee" stroke-width="2.5" filter="url(#neonGlowCyan)"/>
    <path class="laser-beam" d="M -50 130 L 1250 130" stroke="#a855f7" stroke-width="2" filter="url(#neonGlowPurple)"/>
  </g>

  <!-- Cyber Scanner FX Line -->
  <rect class="scanline" x="0" y="0" width="1200" height="18" fill="url(#glassGrad)"/>

  <!-- ================= CITY BUILDINGS (BACKGROUND & COMMUNITY REPOS) ================= -->

  <!-- Small Background Building 1 -->
  <g class="building-group slate" transform="translate(100, 310)">
    <polygon class="tower-roof" points="20,0 50,-12 70,0 40,12" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="20,0 40,12 40,140 20,128" fill="url(#slateFront)"/>
    <polygon points="40,12 70,0 70,128 40,140" fill="url(#slateSide)"/>
  </g>

  <!-- Medium Community Building 2 -->
  <g class="building-group cyan" transform="translate(200, 240)">
    <polygon class="tower-roof" points="30,0 70,-18 100,0 60,18" stroke="#22d3ee" stroke-width="1"/>
    <polygon points="30,0 60,18 60,210 30,192" fill="url(#cyanFront)"/>
    <polygon points="60,18 100,0 100,192 60,210" fill="url(#cyanSide)"/>
    <line x1="60" y1="18" x2="60" y2="210" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
    <!-- Stories -->
    <g class="floor-story">
      <polygon points="32,25 58,40 58,44 32,29" fill="url(#storyLedCyan)"/>
      <polygon points="32,55 58,70 58,74 32,59" fill="url(#storyLedCyan)"/>
      <polygon points="32,85 58,100 58,104 32,89" fill="url(#storyLedCyan)"/>
      <polygon points="32,115 58,130 58,134 32,119" fill="url(#storyLedCyan)"/>
      <polygon points="32,145 58,160 58,164 32,149" fill="url(#storyLedCyan)"/>
      <polygon points="32,175 58,190 58,194 32,179" fill="url(#storyLedCyan)"/>
    </g>
  </g>

  <!-- ================= TOWER 3: YOUR UNIQUE CROWN BUILDING (GOLD/HERO) ================= -->
  <g class="building-group gold" transform="translate(420, 120)">
    <!-- Crown Spire / Beacon -->
    <line x1="90" y1="-20" x2="90" y2="-75" stroke="#facc15" stroke-width="3.5" filter="url(#neonGlowGold)"/>
    <polygon points="90,-85 82,-70 98,-70" fill="#fef08a" filter="url(#neonGlowGold)"/>
    <circle cx="90" cy="-85" r="5" fill="#ffffff" filter="drop-shadow(0 0 12px #facc15)"/>

    <!-- 3D Roof -->
    <polygon class="tower-roof" points="40,0 100,-25 140,0 80,25" stroke="#fef08a" stroke-width="2"/>
    
    <!-- Left Face -->
    <polygon points="40,0 80,25 80,330 40,305" fill="url(#goldFront)" stroke="#facc15" stroke-opacity="0.5" stroke-width="1.5"/>
    
    <!-- Right Face -->
    <polygon points="80,25 140,0 140,305 80,330" fill="url(#goldSide)" stroke="#b45309" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- Illuminated Gold Center Ridge -->
    <line x1="80" y1="25" x2="80" y2="330" stroke="#fef08a" stroke-width="2.5" filter="url(#neonGlowGold)"/>

    <!-- 18 Golden Story Bands -->
    <g class="floor-story">
      <polygon points="42,20 78,42 78,47 42,25" fill="url(#storyLedGold)"/>
      <polygon points="42,36 78,58 78,63 42,41" fill="url(#storyLedGold)"/>
      <polygon points="42,52 78,74 78,79 42,57" fill="url(#storyLedGold)"/>
      <polygon points="42,68 78,90 78,95 42,73" fill="url(#storyLedGold)"/>
      <polygon points="42,84 78,106 78,111 42,89" fill="url(#storyLedGold)"/>
      <polygon points="42,100 78,122 78,127 42,105" fill="url(#storyLedGold)"/>
      <polygon points="42,116 78,138 78,143 42,121" fill="url(#storyLedGold)"/>
      <polygon points="42,132 78,154 78,159 42,137" fill="url(#storyLedGold)"/>
      <polygon points="42,148 78,170 78,175 42,153" fill="url(#storyLedGold)"/>
      <polygon points="42,164 78,186 78,191 42,169" fill="url(#storyLedGold)"/>
      <polygon points="42,180 78,202 78,207 42,185" fill="url(#storyLedGold)"/>
      <polygon points="42,196 78,218 78,223 42,201" fill="url(#storyLedGold)"/>
      <polygon points="42,212 78,234 78,239 42,217" fill="url(#storyLedGold)"/>
      <polygon points="42,228 78,250 78,255 42,233" fill="url(#storyLedGold)"/>
      <polygon points="42,244 78,266 78,271 42,249" fill="url(#storyLedGold)"/>
      <polygon points="42,260 78,282 78,287 42,265" fill="url(#storyLedGold)"/>
      <polygon points="42,276 78,298 78,303 42,281" fill="url(#storyLedGold)"/>
      <polygon points="42,292 78,314 78,319 42,297" fill="url(#storyLedGold)"/>
    </g>

    <!-- Base Golden Aura Ring -->
    <ellipse cx="90" cy="328" rx="65" ry="15" fill="none" stroke="#facc15" stroke-width="3" filter="url(#neonGlowGold)" opacity="0.9"/>

    <!-- Building Label -->
    <text x="-15" y="365" fill="#facc15" font-family="ui-monospace, SFMono-Regular, monospace" font-weight="700" font-size="13" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))">⭐ YOU (UNIQUE REPO) · 1,850 Commits (18 Stories)</text>
  </g>

  <!-- Community Building 4 -->
  <g class="building-group cyan" transform="translate(640, 210)">
    <polygon class="tower-roof" points="25,0 60,-15 85,0 50,15" stroke="#22d3ee" stroke-width="1"/>
    <polygon points="25,0 50,15 50,240 25,225" fill="url(#cyanFront)"/>
    <polygon points="50,15 85,0 85,225 50,240" fill="url(#cyanSide)"/>
    <g class="floor-story">
      <polygon points="27,20 48,32 48,36 27,24" fill="url(#storyLedCyan)"/>
      <polygon points="27,50 48,62 48,66 27,54" fill="url(#storyLedCyan)"/>
      <polygon points="27,80 48,92 48,96 27,84" fill="url(#storyLedCyan)"/>
      <polygon points="27,110 48,122 48,126 27,114" fill="url(#storyLedCyan)"/>
      <polygon points="27,140 48,152 48,156 27,144" fill="url(#storyLedCyan)"/>
      <polygon points="27,170 48,182 48,186 27,174" fill="url(#storyLedCyan)"/>
      <polygon points="27,200 48,212 48,216 27,204" fill="url(#storyLedCyan)"/>
    </g>
  </g>

  <!-- ================= TOWER 5: GLOBAL TALLEST MEGATOWER (4,850 COMMITS) ================= -->
  <g class="building-group purple" transform="translate(820, 50)">
    <!-- Top Spire -->
    <line x1="110" y1="-20" x2="110" y2="-70" stroke="#c084fc" stroke-width="3" filter="url(#neonGlowPurple)"/>
    <circle cx="110" cy="-70" r="4.5" fill="#f43f5e" filter="drop-shadow(0 0 10px #f43f5e)"/>

    <!-- 3D Roof -->
    <polygon class="tower-roof" points="50,0 120,-30 170,0 100,30" stroke="#e9d5ff" stroke-width="1.5"/>
    
    <!-- Left Face -->
    <polygon points="50,0 100,30 100,400 50,370" fill="url(#purpleFront)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
    
    <!-- Right Face -->
    <polygon points="100,30 170,0 170,370 100,400" fill="url(#purpleSide)" stroke="#581c87" stroke-opacity="0.5" stroke-width="1"/>

    <!-- Center Ridge -->
    <line x1="100" y1="30" x2="100" y2="400" stroke="#e9d5ff" stroke-width="2" filter="url(#neonGlowPurple)"/>

    <!-- 22 Story Floor Bands -->
    <g class="floor-story" style="animation-duration: 3s;">
      <polygon points="53,20 97,46 97,51 53,25" fill="url(#storyLedPurple)"/>
      <polygon points="53,36 97,62 97,67 53,41" fill="url(#storyLedPurple)"/>
      <polygon points="53,52 97,78 97,83 53,57" fill="url(#storyLedPurple)"/>
      <polygon points="53,68 97,94 97,99 53,73" fill="url(#storyLedPurple)"/>
      <polygon points="53,84 97,110 97,115 53,89" fill="url(#storyLedPurple)"/>
      <polygon points="53,100 97,126 97,131 53,105" fill="url(#storyLedPurple)"/>
      <polygon points="53,116 97,142 97,147 53,121" fill="url(#storyLedPurple)"/>
      <polygon points="53,132 97,158 97,163 53,137" fill="url(#storyLedPurple)"/>
      <polygon points="53,148 97,174 97,179 53,153" fill="url(#storyLedPurple)"/>
      <polygon points="53,164 97,190 97,195 53,169" fill="url(#storyLedPurple)"/>
      <polygon points="53,180 97,206 97,211 53,185" fill="url(#storyLedPurple)"/>
      <polygon points="53,196 97,222 97,227 53,201" fill="url(#storyLedPurple)"/>
      <polygon points="53,212 97,238 97,243 53,217" fill="url(#storyLedPurple)"/>
      <polygon points="53,228 97,254 97,259 53,233" fill="url(#storyLedPurple)"/>
      <polygon points="53,244 97,270 97,275 53,249" fill="url(#storyLedPurple)"/>
      <polygon points="53,260 97,286 97,291 53,265" fill="url(#storyLedPurple)"/>
      <polygon points="53,276 97,302 97,307 53,281" fill="url(#storyLedPurple)"/>
      <polygon points="53,292 97,318 97,323 53,297" fill="url(#storyLedPurple)"/>
      <polygon points="53,308 97,334 97,339 53,313" fill="url(#storyLedPurple)"/>
      <polygon points="53,324 97,350 97,355 53,329" fill="url(#storyLedPurple)"/>
      <polygon points="53,340 97,366 97,371 53,345" fill="url(#storyLedPurple)"/>
      <polygon points="53,356 97,382 97,387 53,361" fill="url(#storyLedPurple)"/>
    </g>

    <!-- Base Aura -->
    <ellipse cx="110" cy="398" rx="75" ry="16" fill="none" stroke="#a855f7" stroke-width="2.5" filter="url(#neonGlowPurple)" opacity="0.85"/>

    <!-- Building Label -->
    <text x="-10" y="435" fill="#c084fc" font-family="ui-monospace, SFMono-Regular, monospace" font-weight="700" font-size="13" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))">🏆 TALLEST GLOBAL TOWER · 4,850 Commits (22 Stories)</text>
  </g>

  <!-- Small Background Building 6 -->
  <g class="building-group slate" transform="translate(1040, 290)">
    <polygon class="tower-roof" points="20,0 50,-12 70,0 40,12" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="20,0 40,12 40,160 20,148" fill="url(#slateFront)"/>
    <polygon points="40,12 70,0 70,148 40,160" fill="url(#slateSide)"/>
  </g>

</svg>
