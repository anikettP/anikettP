## 🌆 Developer City Animation
## 🌆 Developer City (pseudo‑3D + “live” data)
GitHub profile READMEs cannot run JavaScript or call APIs in the browser, so this is an **animated SVG** plus an **Actions job** that regenerates the SVG from the GitHub API (tower height tracks your **public repo count**; the tallest tower tracks the current **top user by public repos** via search; each horizontal band on your tower approximates **one repo layer**).
