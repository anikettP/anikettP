<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Futuristic developer city animation">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060b1a">
        <animate attributeName="stop-color" values="#060b1a;#0a122b;#060b1a" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a2a4a">
        <animate attributeName="stop-color" values="#1a2a4a;#13203d;#1a2a4a" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="horizonGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1121"/>
      <stop offset="100%" stop-color="#02050d"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .star { fill: #dbeafe; opacity: .22; animation: twinkle 3.5s ease-in-out infinite alternate; }
      .window { fill: #334155; animation: winBlink 4.6s infinite; }
      .window2 { fill: #293548; animation: winBlink2 5.2s infinite; }
      .neon { filter: url(#softGlow); animation: neonPulse 2.2s ease-in-out infinite; }
      .codePath { fill: none; stroke: #22d3ee; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 8 10; animation: codeFlow 3s linear infinite; }
      .cloud { fill: #9ca3af; opacity: .09; animation: cloudMove 28s linear infinite; }
      .cloud2 { fill: #cbd5e1; opacity: .06; animation: cloudMove2 36s linear infinite; }
      .scanLine { fill: #38bdf8; opacity: .22; animation: scanDown 4.5s linear infinite; }
      .drone { animation: dronePath 10s ease-in-out infinite; }
      .train { animation: trainRide 9s linear infinite; }
      .terminalCursor { animation: cursorBlink .9s steps(2,end) infinite; }
      .floatingParticle { animation: floatUp 6s ease-in infinite; opacity: .0; }
      .parallaxBack { animation: driftBack 14s ease-in-out infinite alternate; }
      .parallaxFront { animation: driftFront 9s ease-in-out infinite alternate; }

      @keyframes twinkle { from { opacity:.15 } to { opacity:.9 } }
      @keyframes winBlink {
        0%,100%{ fill:#334155 } 35%{ fill:#fde047 } 55%{ fill:#22d3ee } 72%{ fill:#a78bfa }
      }
      @keyframes winBlink2 {
        0%,100%{ fill:#293548 } 45%{ fill:#60a5fa } 68%{ fill:#facc15 }
      }
      @keyframes neonPulse { 0%,100%{opacity:.55} 50%{opacity:1} }
      @keyframes codeFlow { to { stroke-dashoffset:-180 } }
      @keyframes cloudMove { from { transform: translateX(-260px)} to { transform: translateX(1380px)} }
      @keyframes cloudMove2 { from { transform: translateX(1350px)} to { transform: translateX(-340px)} }
      @keyframes scanDown { 0%{transform:translateY(0)} 100%{transform:translateY(165px)} }
      @keyframes dronePath {
        0%{transform:translate(0,0)} 25%{transform:translate(260px,-14px)}
        50%{transform:translate(560px,8px)} 75%{transform:translate(860px,-16px)}
        100%{transform:translate(1120px,0)}
      }
      @keyframes trainRide { from { transform: translateX(-360px)} to { transform: translateX(1420px)} }
      @keyframes cursorBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes floatUp {
        0%{ transform: translateY(24px); opacity:0; }
        30%{ opacity:.65; }
        100%{ transform: translateY(-30px); opacity:0; }
      }
      @keyframes driftBack { from { transform: translateX(-6px)} to { transform: translateX(6px)} }
      @keyframes driftFront { from { transform: translateX(8px)} to { transform: translateX(-8px)} }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="420" fill="url(#skyGrad)"/>
  <rect y="235" width="1280" height="32" fill="url(#horizonGlow)" filter="url(#bigGlow)"/>

  <!-- Clouds -->
  <g class="parallaxBack">
    <ellipse class="cloud" cx="120" cy="78" rx="70" ry="18"/>
    <ellipse class="cloud" cx="176" cy="76" rx="54" ry="14"/>
    <ellipse class="cloud2" cx="860" cy="62" rx="80" ry="20"/>
    <ellipse class="cloud2" cx="924" cy="58" rx="56" ry="14"/>
  </g>

  <g class="parallaxBack">
    <ellipse class="cloud" cx="320" cy="120" rx="64" ry="16" style="animation-delay:-10s"/>
    <ellipse class="cloud2" cx="1040" cy="108" rx="76" ry="18" style="animation-delay:-14s"/>
  </g>

  <!-- Stars -->
  <g>
    <circle class="star" cx="85" cy="50" r="1.8"/>
    <circle class="star" cx="140" cy="88" r="1.5" style="animation-delay:.3s"/>
    <circle class="star" cx="230" cy="42" r="1.7" style="animation-delay:.7s"/>
    <circle class="star" cx="312" cy="74" r="1.4" style="animation-delay:1s"/>
    <circle class="star" cx="424" cy="40" r="1.9" style="animation-delay:.2s"/>
    <circle class="star" cx="534" cy="86" r="1.3" style="animation-delay:.9s"/>
    <circle class="star" cx="646" cy="55" r="1.6" style="animation-delay:.6s"/>
    <circle class="star" cx="760" cy="38" r="1.8" style="animation-delay:1.4s"/>
    <circle class="star" cx="858" cy="79" r="1.3" style="animation-delay:1.8s"/>
    <circle class="star" cx="952" cy="46" r="1.7" style="animation-delay:1.1s"/>
    <circle class="star" cx="1040" cy="84" r="1.5" style="animation-delay:.5s"/>
    <circle class="star" cx="1158" cy="52" r="1.7" style="animation-delay:1.6s"/>
  </g>

  <!-- Ground -->
  <rect y="300" width="1280" height="120" fill="url(#groundGrad)"/>

  <!-- Back skyline -->
  <g class="parallaxBack">
    <rect x="30"  y="170" width="82"  height="130" fill="#121c31"/>
    <rect x="122" y="145" width="66"  height="155" fill="#0e172a"/>
    <rect x="198" y="185" width="74"  height="115" fill="#16243f"/>
    <rect x="282" y="126" width="102" height="174" fill="#0b1324"/>
    <rect x="396" y="168" width="78"  height="132" fill="#14213b"/>
    <rect x="486" y="138" width="94"  height="162" fill="#0f1a31"/>
    <rect x="590" y="182" width="72"  height="118" fill="#172744"/>
    <rect x="674" y="132" width="104" height="168" fill="#0c162b"/>
    <rect x="790" y="164" width="86"  height="136" fill="#13213a"/>
    <rect x="886" y="120" width="110" height="180" fill="#0a1326"/>
    <rect x="1008" y="176" width="78"  height="124" fill="#152441"/>
    <rect x="1098" y="142" width="92"  height="158" fill="#0d172c"/>
    <rect x="1200" y="186" width="56"  height="114" fill="#172746"/>
  </g>

  <!-- Windows -->
  <g>
    <rect class="window"  x="50" y="188" width="8" height="8"/><rect class="window2" x="66" y="188" width="8" height="8"/><rect class="window"  x="82" y="188" width="8" height="8"/>
    <rect class="window2" x="50" y="206" width="8" height="8"/><rect class="window"  x="66" y="206" width="8" height="8"/><rect class="window2" x="82" y="206" width="8" height="8"/>
    <rect class="window"  x="138" y="164" width="8" height="8"/><rect class="window2" x="154" y="164" width="8" height="8"/><rect class="window"  x="170" y="164" width="8" height="8"/>
    <rect class="window2" x="138" y="182" width="8" height="8"/><rect class="window"  x="154" y="182" width="8" height="8"/><rect class="window2" x="170" y="182" width="8" height="8"/>
    <rect class="window"  x="314" y="154" width="9" height="9"/><rect class="window2" x="333" y="154" width="9" height="9"/><rect class="window" x="352" y="154" width="9" height="9"/>
    <rect class="window2" x="314" y="174" width="9" height="9"/><rect class="window"  x="333" y="174" width="9" height="9"/><rect class="window2" x="352" y="174" width="9" height="9"/>
    <rect class="window"  x="518" y="166" width="9" height="9"/><rect class="window2" x="537" y="166" width="9" height="9"/><rect class="window" x="556" y="166" width="9" height="9"/>
    <rect class="window2" x="702" y="160" width="10" height="10"/><rect class="window" x="722" y="160" width="10" height="10"/><rect class="window2" x="742" y="160" width="10" height="10"/>
    <rect class="window"  x="918" y="152" width="11" height="11"/><rect class="window2" x="940" y="152" width="11" height="11"/><rect class="window" x="962" y="152" width="11" height="11"/>
    <rect class="window2" x="918" y="176" width="11" height="11"/><rect class="window" x="940" y="176" width="11" height="11"/><rect class="window2" x="962" y="176" width="11" height="11"/>
    <rect class="window"  x="1122" y="166" width="10" height="10"/><rect class="window2" x="1142" y="166" width="10" height="10"/><rect class="window" x="1162" y="166" width="10" height="10"/>
  </g>

  <!-- Foreground road -->
  <g class="parallaxFront">
    <rect x="0" y="320" width="1280" height="52" fill="#060b15"/>
    <rect x="0" y="344" width="1280" height="4" fill="#0ea5e9" opacity=".45"/>
    <rect x="0" y="336" width="1280" height="2" fill="#22d3ee" opacity=".15"/>
  </g>

  <!-- Train -->
  <g class="train">
    <rect x="0" y="327" width="220" height="24" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".8"/>
    <rect x="12" y="332" width="34" height="11" rx="2" fill="#67e8f9" opacity=".5"/>
    <rect x="54" y="332" width="34" height="11" rx="2" fill="#67e8f9" opacity=".5"/>
    <rect x="96" y="332" width="34" height="11" rx="2" fill="#67e8f9" opacity=".5"/>
    <rect x="138" y="332" width="34" height="11" rx="2" fill="#67e8f9" opacity=".5"/>
    <rect x="180" y="332" width="28" height="11" rx="2" fill="#67e8f9" opacity=".5"/>
  </g>

  <!-- Neon sign -->
  <g class="neon">
    <rect x="455" y="254" width="370" height="28" rx="10" fill="#0b1222" stroke="#22d3ee" stroke-opacity=".95"/>
    <text x="474" y="273" font-family="JetBrains Mono, monospace" font-size="16" fill="#67e8f9">
      &lt;/&gt; build • debug • deploy • repeat
    </text>
  </g>

  <!-- Terminal Card -->
  <g transform="translate(890,220)">
    <rect x="0" y="0" width="330" height="96" rx="12" fill="#0b1326" stroke="#1e293b"/>
    <rect x="0" y="0" width="330" height="20" rx="12" fill="#0f1b33"/>
    <circle cx="14" cy="10" r="3.2" fill="#ef4444"/>
    <circle cx="26" cy="10" r="3.2" fill="#f59e0b"/>
    <circle cx="38" cy="10" r="3.2" fill="#22c55e"/>
    <text x="14" y="40" fill="#22d3ee" font-size="12" font-family="JetBrains Mono, monospace">$ npm run ship</text>
    <text x="14" y="58" fill="#93c5fd" font-size="11.5" font-family="JetBrains Mono, monospace">✓ tests passed • build done • deploy ok</text>
    <text x="14" y="76" fill="#67e8f9" font-size="11.5" font-family="JetBrains Mono, monospace">next: optimize response time</text>
    <rect class="terminalCursor" x="221" y="66" width="7" height="11" fill="#22d3ee"/>
  </g>

  <!-- Scan tower -->
  <g>
    <rect x="1035" y="124" width="70" height="168" fill="#0d162a"/>
    <rect class="scanLine" x="1038" y="132" width="64" height="14"/>
  </g>

  <!-- Code line -->
  <path class="codePath" d="M40 298 C180 270, 320 320, 470 292 S780 265, 1240 296"/>

  <!-- Floating particles -->
  <g>
    <circle class="floatingParticle" cx="260" cy="286" r="2" fill="#22d3ee"/>
    <circle class="floatingParticle" cx="300" cy="292" r="2" fill="#60a5fa" style="animation-delay:1s"/>
    <circle class="floatingParticle" cx="340" cy="288" r="2" fill="#a78bfa" style="animation-delay:2s"/>
    <circle class="floatingParticle" cx="740" cy="290" r="2" fill="#22d3ee" style="animation-delay:.7s"/>
    <circle class="floatingParticle" cx="780" cy="294" r="2" fill="#67e8f9" style="animation-delay:1.7s"/>
    <circle class="floatingParticle" cx="820" cy="289" r="2" fill="#a78bfa" style="animation-delay:2.6s"/>
  </g>

  <!-- Drone -->
  <g class="drone">
    <rect x="24" y="95" width="40" height="12" rx="5" fill="#0ea5e9"/>
    <circle cx="22" cy="101" r="4" fill="#94a3b8"/>
    <circle cx="66" cy="101" r="4" fill="#94a3b8"/>
    <rect x="40" y="98" width="8" height="5" rx="2" fill="#e2e8f0"/>
  </g>
</svg>
