<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated developer city">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .star { fill: #cbd5e1; opacity: 0.2; animation: twinkle 3s infinite alternate; }
      .window { fill: #334155; animation: windowBlink 4s infinite; }
      .neon { fill: #22d3ee; filter: url(#glow); animation: neonPulse 2.2s infinite; }
      .scan { fill: #38bdf8; opacity: 0.3; animation: scanMove 4s linear infinite; }
      .code { fill: none; stroke: #22d3ee; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 8; animation: codeFlow 3s linear infinite; }
      .drone { animation: droneFly 7s ease-in-out infinite; }

      @keyframes twinkle {
        0% { opacity: 0.1; }
        100% { opacity: 0.9; }
      }
      @keyframes windowBlink {
        0%, 100% { fill: #334155; }
        40% { fill: #facc15; }
        60% { fill: #38bdf8; }
      }
      @keyframes neonPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes scanMove {
        0% { transform: translateY(0); opacity: 0.15; }
        50% { opacity: 0.35; }
        100% { transform: translateY(150px); opacity: 0.05; }
      }
      @keyframes codeFlow {
        to { stroke-dashoffset: -120; }
      }
      @keyframes droneFly {
        0% { transform: translate(0px, 0px); }
        25% { transform: translate(220px, -10px); }
        50% { transform: translate(500px, 8px); }
        75% { transform: translate(760px, -12px); }
        100% { transform: translate(1020px, 0px); }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)" />

  <circle cx="120" cy="70" r="2" class="star" />
  <circle cx="210" cy="50" r="2" class="star" style="animation-delay: .3s;" />
  <circle cx="290" cy="90" r="2" class="star" style="animation-delay: .6s;" />
  <circle cx="430" cy="48" r="2" class="star" style="animation-delay: .8s;" />
  <circle cx="610" cy="68" r="2" class="star" style="animation-delay: .5s;" />
  <circle cx="760" cy="52" r="2" class="star" style="animation-delay: .2s;" />
  <circle cx="870" cy="88" r="2" class="star" style="animation-delay: .9s;" />
  <circle cx="1010" cy="62" r="2" class="star" style="animation-delay: .4s;" />
  <circle cx="1100" cy="42" r="2" class="star" style="animation-delay: .7s;" />

  <rect x="0" y="260" width="1200" height="60" fill="url(#ground)" />

  <rect x="60" y="120" width="90" height="140" fill="#1f2937" />
  <rect x="170" y="90" width="85" height="170" fill="#111827" />
  <rect x="270" y="135" width="75" height="125" fill="#1e293b" />
  <rect x="360" y="70" width="120" height="190" fill="#0b1220" />
  <rect x="500" y="110" width="95" height="150" fill="#1f2937" />
  <rect x="615" y="80" width="105" height="180" fill="#0f172a" />
  <rect x="740" y="140" width="80" height="120" fill="#1e293b" />
  <rect x="835" y="95" width="98" height="165" fill="#111827" />
  <rect x="950" y="60" width="115" height="200" fill="#0b1220" />
  <rect x="1085" y="125" width="70" height="135" fill="#1f2937" />

  <g>
    <rect x="76" y="140" width="10" height="10" class="window"/>
    <rect x="96" y="140" width="10" height="10" class="window"/>
    <rect x="116" y="140" width="10" height="10" class="window"/>
    <rect x="76" y="162" width="10" height="10" class="window" style="animation-delay:.5s;"/>
    <rect x="96" y="162" width="10" height="10" class="window" style="animation-delay:.8s;"/>
    <rect x="116" y="162" width="10" height="10" class="window" style="animation-delay:1.2s;"/>
    <rect x="186" y="110" width="10" height="10" class="window" style="animation-delay:.3s;"/>
    <rect x="206" y="110" width="10" height="10" class="window"/>
    <rect x="226" y="110" width="10" height="10" class="window" style="animation-delay:.9s;"/>
    <rect x="186" y="132" width="10" height="10" class="window" style="animation-delay:1.1s;"/>
    <rect x="206" y="132" width="10" height="10" class="window"/>
    <rect x="226" y="132" width="10" height="10" class="window" style="animation-delay:.4s;"/>
    <rect x="382" y="96" width="12" height="12" class="window" />
    <rect x="406" y="96" width="12" height="12" class="window" style="animation-delay:.6s;"/>
    <rect x="430" y="96" width="12" height="12" class="window" style="animation-delay:1s;"/>
    <rect x="382" y="122" width="12" height="12" class="window" style="animation-delay:.2s;"/>
    <rect x="406" y="122" width="12" height="12" class="window"/>
    <rect x="430" y="122" width="12" height="12" class="window" style="animation-delay:.7s;"/>
    <rect x="974" y="88" width="13" height="13" class="window"/>
    <rect x="1000" y="88" width="13" height="13" class="window" style="animation-delay:.5s;"/>
    <rect x="1026" y="88" width="13" height="13" class="window" style="animation-delay:.9s;"/>
    <rect x="974" y="114" width="13" height="13" class="window" style="animation-delay:.4s;"/>
    <rect x="1000" y="114" width="13" height="13" class="window"/>
    <rect x="1026" y="114" width="13" height="13" class="window" style="animation-delay:1.1s;"/>
  </g>

  <rect x="344" y="226" width="160" height="6" class="neon" rx="3"/>
  <text x="350" y="220" fill="#93c5fd" font-size="18" font-family="monospace">&lt;/&gt; ship code daily</text>

  <rect x="920" y="86" width="140" height="120" class="scan" />

  <path d="M80 280 C200 250, 320 300, 460 275 S760 250, 1120 280" class="code"/>

  <g class="drone">
    <rect x="30" y="64" width="34" height="10" rx="4" fill="#38bdf8"/>
    <circle cx="28" cy="69" r="4" fill="#94a3b8"/>
    <circle cx="68" cy="69" r="4" fill="#94a3b8"/>
    <circle cx="47" cy="69" r="2" fill="#f8fafc"/>
  </g>
</svg>
